[project]
name = "gleis404"
version = "0.1.0"
description = "Public transit punctuality analyzer: collects realtime departures from the Transitous API, stores delay history in SQLite, and reports and plots punctuality trends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "python-dotenv>=1.2.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gleis404"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ruff>=0.8",
]
